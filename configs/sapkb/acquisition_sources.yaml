watchlist_priority:
  authors:
    - name: "汪子熙"
      aka: ["Jerry Wang", "JerryWang"]
      platform: csdn
      username: i042416
      homepage: "https://jerry.blog.csdn.net/"
      reason: "SAP 大神，最高优先（含 BTP 两专栏）"
    - name: "Henry-SAP"
      platform: csdn
      username: m0_45197968
      homepage: "https://blog.csdn.net/m0_45197968"
      reason: "优先博主"
    - name: "喜欢打酱油的老鸟"
      platform: csdn
      username: weixin_42137700
      homepage: "https://blog.csdn.net/weixin_42137700"
      reason: "优先博主"
